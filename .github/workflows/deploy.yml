name: PROD GKE Deploy - React Vite

on:
  push:
    branches:
      - refactor
  workflow_dispatch:

env:
  PROJECT_ID: probestack-prod
  ARTIFACT_REPO: probestack-prod-apps
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  SERVICE_NAME: forgeq-fe
  GKE_CLUSTER: probestack-zonal-cluster
  GKE_LOCATION: us-central1-a
  GKE_LOCATION_FLAG: --zone
  NAMESPACE: forgeq-prod

jobs:
  deploy-prod-react:

    if: github.ref == 'refs/heads/refactor'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      # Node install/build used to run here too, on the bare runner, before
      # any GCP auth existed — npm ci would 403 fetching the private
      # @probestack package (no token wired into this shell yet), and its
      # output (node_modules/dist) was never used anyway: the Docker build
      # below does its own npm ci + npm run build inside the image, with
      # GOOGLE_ARTIFACT_TOKEN correctly wired via a BuildKit secret
      # (see Dockerfile). Removed as dead, broken duplication.

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@probestack-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          no-cache: true 
          secrets: |
            google_artifact_token=${{ steps.auth.outputs.access_token }}
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          ${{ env.GKE_LOCATION_FLAG }} ${{ env.GKE_LOCATION }} \
          --project ${{ env.PROJECT_ID }}

      - name: Deploy react vite service
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          -n ${{ env.NAMESPACE }}

      - name: Force restart deployment
        run: |
          kubectl rollout restart deployment/${{ env.SERVICE_NAME }} \
          -n ${{ env.NAMESPACE }}

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
          -n ${{ env.NAMESPACE }}

      - name: Verify running pods
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}